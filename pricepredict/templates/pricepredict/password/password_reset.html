<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to right, rgba(63, 9, 178), rgba(0, 0, 0)); /* AutoWorth theme gradient */
            color: #ffffff;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1); /* Transparent white */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); /* Soft shadow */
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px); /* Glassmorphism effect */
        }

        h2 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            color: #f0e6e6;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input[type="email"] {
            padding: 14px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        input[type="email"]:focus {
            outline: none;
            border: 2px solid #FF5733; /* Theme color focus effect */
        }

        .btn {
            padding: 14px;
            font-size: 1rem;
            color: #ffffff;
            background: linear-gradient(to right, #FF5733, #C70039); /* AutoWorth theme gradient button */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 87, 51, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 1.8rem;
            }

            p {
                font-size: 0.9rem;
            }

            .btn {
                font-size: 0.9rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Forgot your password?</h2>
    <p>Enter your email address and we’ll send you a link to reset your password.</p>

    <form method="post">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit" class="btn">Reset Password</button>
    </form>
</div>

</body>
</html>
