<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Email Sent</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to right, rgba(63, 9, 178), rgba(0, 0, 0)); /* AutoWorth theme gradient */
            color: #ffffff;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1); /* Transparent white */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); /* Soft shadow */
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px); /* Glassmorphism effect */
        }

        h2 {
            font-size: 2rem;
            color: #28a745; /* Success green */
            margin-bottom: 15px;
        }

        p {
            font-size: 1em;
            color: #ffffff;
            line-height: 1.6;
            margin-top: 10px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 1.8rem;
            }

            p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Password reset email sent</h2>
    <p>We’ve emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
</div>

</body>
</html>
