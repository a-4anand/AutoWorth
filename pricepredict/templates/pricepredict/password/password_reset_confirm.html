<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
       <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to right, rgba(63, 9, 178), rgba(0, 0, 0));/* AutoWorth theme gradient */
            color: #ffffff;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1); /* Transparent white */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); /* Soft shadow */
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px); /* Glassmorphism effect */
        }

        h2 {
            font-size: 2rem;
            color: #28a745; /* Success green */
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            color: #f0e6e6;
            margin-bottom: 20px;
        }

        a {
            color: #FF5733; /* Theme color */
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(255, 87, 51, 0.2); /* Light gradient */
            transition: background 0.3s, color 0.3s;
        }

        a:hover {
            background: rgba(255, 87, 51, 0.9); /* Stronger background on hover */
            color: #fff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 1.8rem;
            }

            p {
                font-size: 0.9rem;
            }

            a {
                font-size: 0.9rem;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Set your new password</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Change Password</button>
    </form>
</div>

</body>
</html>
