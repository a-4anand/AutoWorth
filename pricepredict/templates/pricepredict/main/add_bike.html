{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vehicle Listing</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(to right, rgba(63, 9, 178), rgba(0, 0, 0));
            color: white;
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        footer {
            background: linear-gradient(to right, rgba(63, 9, 178), rgba(0, 0, 0));
            color: white;
            text-align: center;
            padding: 10px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            color: white;

            transition: opacity 0.3s;
        }

        /* Form Container */
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Styling Form Fields */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 20px;
            width: 100%;
        }

        textarea {
            resize: vertical;
        }

        input[type="file"] {
            border: none;
        }

        /* Submit Button */
        button[type="submit"] {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #2980b9;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }

            button[type="submit"] {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Bike Listings Marketplace</h1>
        <nav>
            <a href="{% url 'index' %}" class="btn">Home</a>
            <a href="{% url 'index3' %}" class="btn">About Us</a>
            <a href="{% url 'logout' %}" class="btn">Logout</a>
            <a href="create/" class="btn">Create an Ad</a>
        </nav>
    </header>

    <div class="form-container">
        <h2>Create New Vehicle Listing</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Listing</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Vehicle Listings Marketplace. All rights reserved.</p>
    </footer>
</body>

</html>
